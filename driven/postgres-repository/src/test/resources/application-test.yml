spring:
  output:
    ansi:
      enabled: ALWAYS
  flyway:
    enabled: false
  datasource:
#    url: jdbc:postgresql://localhost:5434/dev
#    username: sa
#    password: root
#    driver-class-name: org.postgresql.Driver
    url: jdbc:h2:mem:db;DB_CLOSE_DELAY=-1
    username: sa
    password: sa
    driver-class-name: org.h2.Driver

decorator:
  datasource:
    enabled: true
#    p6spy:
#      log-file: database.log
#      append: true
#      custom-appender-class: com.p6spy.engine.spy.appender.Slf4JLogger
    datasource-proxy: #
      json-format: false
      count-query: true
      slowQuery:
        enable-logging: false
        threshold: 0.5
        writeIsolation : true
      logging: slf4j
      query:  #
        enable-logging: true
        log-level: INFO
        logger-name: PEPE
      format-sql: true  #
