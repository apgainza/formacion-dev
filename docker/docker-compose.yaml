version: '3.7'

networks:
  local:
    name: dev-network

services:
  db_postgres_dev:
    image: postgres:16
    environment:
      POSTGRES_USER: sa
      POSTGRES_PASSWORD: root
      POSTGRES_DB: dev
    volumes:
      - postgres16-dev-data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    networks:
      - local

volumes:
  postgres16-dev-data:
    driver: local
